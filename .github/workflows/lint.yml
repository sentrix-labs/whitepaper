name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown:
    name: markdownlint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@^0.43

      - name: Run markdownlint (advisory)
        run: |
          markdownlint '*.md' || echo "::warning::markdownlint reported issues (advisory)"

  spellcheck:
    name: spellcheck (advisory)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run cspell (advisory)
        run: |
          npx --yes cspell --no-must-find-files '*.md' || echo "::warning::cspell reported issues (advisory)"

  pdf-build:
    name: build LaTeX PDF (release tag only)
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Compile EN PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: sentrix-whitepaper-en.tex

      - name: Compile ID PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: sentrix-whitepaper-id.tex

      - name: Upload PDFs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            sentrix-whitepaper-en.pdf \
            sentrix-whitepaper-id.pdf --clobber
